name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phi-plaintext-lint:
    name: PHI plaintext lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flag plaintext String fields in contracttype structs
        run: |
          set -euo pipefail
          # Issue #994: clinical free text / coded clinical values must not be
          # stored as plaintext `String` fields in #[contracttype] structs.
          # Contract storage is world-readable via RPC getLedgerEntries and
          # ledger history, so getter auth does not provide confidentiality.
          # Store an EncryptedEnvelopeRef (shared::privacy) or salted hash
          # commitment instead. Only allowlisted identifiers/URIs/codes pass.
          allowlist='^(id|.*_id|.*_ids|uri|.*_uri|url|.*_url|code|.*_code|status|.*_status|kind|.*_kind|type|.*_type|name|.*_name|symbol|.*_symbol|version|.*_version|hash|.*_hash|commitment|.*_commitment|envelope|.*_envelope|ref|.*_ref|memo|.*_memo|reason_code|.*_reason_code)$'
          fail=0
          while IFS= read -r file; do
            # Track whether we are inside a #[contracttype] struct.
            in_struct=0
            while IFS= read -r line; do
              if printf '%s' "$line" | grep -Eq '#\[contracttype\]'; then
                in_struct=1
                continue
              fi
              if [ "$in_struct" -eq 1 ]; then
                if printf '%s' "$line" | grep -Eq '^\s*pub\s+[A-Za-z0-9_]+\s*:\s*String\b'; then
                  field=$(printf '%s' "$line" | sed -E 's/^\s*pub\s+([A-Za-z0-9_]+)\s*:.*/\1/')
                  if ! printf '%s' "$field" | grep -Eq "$allowlist"; then
                    echo "::error file=$file::plaintext String field '$field' in #[contracttype] struct — use EncryptedEnvelopeRef or a salted hash commitment (issue #994)"
                    fail=1
                  fi
                fi
                if printf '%s' "$line" | grep -Eq '^\s*\}'; then
                  in_struct=0
                fi
              fi
            done < "$file"
          done < <(find contracts -path '*/src/*' -name '*.rs' -type f)
          exit "$fail"
